<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b63">
<title>فواتيري</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f1f3f4; --surface:#ffffff; --ink:#14212b; --muted:#5d6b76; --line:#dde2e6;
  --accent:#0f6b63; --accent-ink:#ffffff; --danger:#b3261e; --soft:#e4f1ef;
  --font:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1519; --surface:#172026; --ink:#e8eef1; --muted:#93a1ab; --line:#26323a;
    --accent:#3cc1b0; --accent-ink:#04201c; --danger:#ff8a80; --soft:#18302d; color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;color:var(--muted);margin:20px 0 8px;font-weight:600}
section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--soft);color:var(--ink);font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--danger);background:transparent}
button.ghost{background:transparent;border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.wrap{flex-wrap:wrap}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;text-align:start;background:var(--surface);border:1px solid var(--line);padding:10px}
.chip b{font-weight:600}
.chip span{font-size:13px;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;padding:0;font-size:18px}
.num{font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding-top:10px}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.hist{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;padding:12px}
.hist small{display:block;color:var(--muted);font-weight:400}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{display:flex;gap:4px;width:100%;max-width:560px}
nav button{flex:1;background:transparent;color:var(--muted);padding:8px 2px;font-size:13px}
nav button[aria-current=true]{background:var(--soft);color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center;overflow-x:auto}
.paper img{max-width:100%;display:block;margin:0 auto}
#toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 14px;border-radius:10px;text-align:center;z-index:9;font-size:14px}
#toast[hidden]{display:none}
.status{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-inline-end:6px}
.status.on{background:#2e9e5b}
</style>
</head>
<body>
<main>

<section id="tab-new">
  <h1>فاتورة جديدة</h1>
  <h2>المنتجات (اضغط للإضافة)</h2>
  <div id="chips" class="chips"></div>

  <h2>إضافة صنف يدوي</h2>
  <div class="card row">
    <input id="mName" class="grow" placeholder="اسم الصنف" aria-label="اسم الصنف">
    <input id="mPrice" type="number" inputmode="decimal" placeholder="السعر" style="width:90px" aria-label="السعر">
    <button id="mAdd" class="primary">+</button>
  </div>

  <h2>الفاتورة</h2>
  <div class="card">
    <input id="customer" placeholder="اسم العميل (اختياري)" aria-label="اسم العميل">
    <div id="cart"></div>
    <div class="row" style="margin-top:8px">
      <label for="discount" style="margin:0">خصم</label>
      <input id="discount" type="number" inputmode="decimal" value="0" style="width:110px">
    </div>
    <div class="total"><span>الإجمالي</span><span id="grand" class="num">0</span></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="savePrint" class="primary grow">حفظ وطباعة</button>
    <button id="saveOnly" class="ghost">حفظ فقط</button>
    <button id="clearCart" class="danger">مسح</button>
  </div>
</section>

<section id="tab-products" hidden>
  <h1>المنتجات</h1>
  <div class="card row">
    <input id="pName" class="grow" placeholder="اسم المنتج" aria-label="اسم المنتج">
    <input id="pPrice" type="number" inputmode="decimal" placeholder="السعر" style="width:90px" aria-label="سعر المنتج">
    <button id="pAdd" class="primary">إضافة</button>
  </div>
  <h2>القائمة</h2>
  <div class="card" id="plist"></div>
</section>

<section id="tab-history" hidden>
  <h1>السجل</h1>
  <div class="card row" style="justify-content:space-between">
    <span>مبيعات اليوم</span><b id="today" class="num">0</b>
  </div>
  <h2>الفواتير</h2>
  <div id="hlist"></div>
</section>

<section id="tab-settings" hidden>
  <h1>الإعدادات</h1>
  <h2>الطابعة</h2>
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <span><span id="dot" class="status"></span><span id="pstate">غير متصلة</span></span>
      <button id="connect" class="primary">اتصال بالطابعة</button>
    </div>
    <label for="width">عرض الورق</label>
    <select id="width">
      <option value="384">58 مم</option>
      <option value="576">80 مم</option>
    </select>
    <div class="row" style="margin-top:10px"><button id="testPrint" class="ghost grow">طباعة تجريبية</button></div>
    <p class="muted" id="btNote"></p>
  </div>

  <h2>بيانات النشاط</h2>
  <div class="card">
    <label for="shop">اسم النشاط</label><input id="shop">
    <label for="phone">التليفون</label><input id="phone" inputmode="tel">
    <label for="address">العنوان</label><input id="address">
    <label for="footer">رسالة أسفل الفاتورة</label><input id="footer">
    <label for="currency">العملة</label><input id="currency">
    <label for="nextNo">رقم الفاتورة القادمة</label><input id="nextNo" type="number" inputmode="numeric">
    <label for="logo">اللوجو</label>
    <input id="logo" type="file" accept="image/*">
    <div class="row" style="margin-top:8px"><button id="rmLogo" class="danger">حذف اللوجو</button></div>
  </div>

  <h2>نسخة احتياطية</h2>
  <div class="card row wrap">
    <button id="exportBtn" class="ghost grow">تصدير البيانات</button>
    <label class="ghost grow" style="margin:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--ink);font-size:16px;font-weight:600;cursor:pointer">
      استيراد <input id="importFile" type="file" accept="application/json" hidden>
    </label>
  </div>
</section>

</main>

<nav><div class="in">
  <button data-tab="new" aria-current="true">فاتورة</button>
  <button data-tab="products">المنتجات</button>
  <button data-tab="history">السجل</button>
  <button data-tab="settings">الإعدادات</button>
</div></nav>

<div id="sheet" class="sheet" hidden>
  <div class="panel">
    <div class="paper"><img id="preview" alt="معاينة الفاتورة"></div>
    <div class="row wrap" style="margin-top:12px">
      <button id="shPrint" class="primary grow">طباعة</button>
      <button id="shImg" class="ghost">حفظ صورة</button>
      <button id="shClose" class="ghost">إغلاق</button>
    </div>
    <div class="row" style="margin-top:6px"><button id="shDel" class="danger" hidden>حذف الفاتورة</button></div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";
var KEY="faweety_v1";
var S={products:[],invoices:[],settings:{shop:"اسم المحل",phone:"",address:"",footer:"شكراً لزيارتكم",currency:"ج.م",width:384,next:1,logo:""}};
try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);S.products=d.products||[];S.invoices=d.invoices||[];Object.assign(S.settings,d.settings||{});}
  else{S.products=[{id:1,name:"صنف مثال 1",price:25},{id:2,name:"صنف مثال 2",price:60},{id:3,name:"خدمة مثال",price:100}];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var $=function(s){return document.querySelector(s);};
var cart=[];var current=null;var mode="new";
function fmt(n){return (Math.round(n*100)/100).toLocaleString("en");}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},3200);}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

/* tabs */
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("nav button").forEach(function(x){x.removeAttribute("aria-current");});
  b.setAttribute("aria-current","true");
  ["new","products","history","settings"].forEach(function(t){$("#tab-"+t).hidden=(t!==b.dataset.tab);});
  if(b.dataset.tab==="history")renderHistory();
  window.scrollTo(0,0);};});

/* products */
function renderProducts(){
  var chips=$("#chips");chips.textContent="";
  if(!S.products.length){chips.appendChild(el("div","empty","ضيف منتجات من تبويب المنتجات"));}
  S.products.forEach(function(p){var b=el("button","chip");b.appendChild(el("b",null,p.name));b.appendChild(el("span","num",fmt(p.price)+" "+S.settings.currency));
    b.onclick=function(){addToCart(p.name,p.price);};chips.appendChild(b);});
  var l=$("#plist");l.textContent="";
  if(!S.products.length)l.appendChild(el("div","empty","لا توجد منتجات"));
  S.products.forEach(function(p){var r=el("div","line");r.appendChild(el("span",null,p.name));
    var x=el("div","row");x.appendChild(el("span","num",fmt(p.price)));var del=el("button","danger","حذف");
    del.onclick=function(){S.products=S.products.filter(function(q){return q.id!==p.id;});save();renderProducts();};x.appendChild(del);r.appendChild(x);l.appendChild(r);});
}
$("#pAdd").onclick=function(){var n=$("#pName").value.trim(),p=parseFloat($("#pPrice").value);
  if(!n||isNaN(p)){toast("اكتب الاسم والسعر");return;}
  S.products.push({id:Date.now(),name:n,price:p});save();$("#pName").value="";$("#pPrice").value="";renderProducts();};

/* cart */
function addToCart(name,price){var f=cart.filter(function(i){return i.name===name&&i.price===price;})[0];
  if(f)f.qty++;else cart.push({name:name,price:price,qty:1});renderCart();}
$("#mAdd").onclick=function(){var n=$("#mName").value.trim(),p=parseFloat($("#mPrice").value);
  if(!n||isNaN(p)){toast("اكتب الاسم والسعر");return;}addToCart(n,p);$("#mName").value="";$("#mPrice").value="";};
function totals(items,disc){var s=0;items.forEach(function(i){s+=i.price*i.qty;});disc=Math.min(disc||0,s);return{sub:s,disc:disc,total:s-disc};}
function renderCart(){
  var c=$("#cart");c.textContent="";
  if(!cart.length)c.appendChild(el("div","empty","لم تتم إضافة أصناف بعد"));
  cart.forEach(function(i,idx){
    var r=el("div","line");var a=el("div");a.appendChild(el("div",null,i.name));a.appendChild(el("div","muted num",fmt(i.price)+" × "+i.qty+" = "+fmt(i.price*i.qty)));
    var q=el("div","qty");var m=el("button",null,"−"),pl=el("button",null,"+");
    m.onclick=function(){i.qty--;if(i.qty<=0)cart.splice(idx,1);renderCart();};
    pl.onclick=function(){i.qty++;renderCart();};
    q.appendChild(m);q.appendChild(el("b","num",String(i.qty)));q.appendChild(pl);r.appendChild(a);r.appendChild(q);c.appendChild(r);});
  $("#grand").textContent=fmt(totals(cart,parseFloat($("#discount").value)).total)+" "+S.settings.currency;
}
$("#discount").oninput=renderCart;
$("#clearCart").onclick=function(){cart=[];$("#discount").value=0;$("#customer").value="";renderCart();};
function makeInvoice(){
  if(!cart.length){toast("أضف صنف واحد على الأقل");return null;}
  var t=totals(cart,parseFloat($("#discount").value));
  var inv={no:S.settings.next++,ts:Date.now(),customer:$("#customer").value.trim(),items:cart.map(function(i){return{name:i.name,price:i.price,qty:i.qty};}),discount:t.disc,total:t.total};
  S.invoices.push(inv);save();
  cart=[];$("#discount").value=0;$("#customer").value="";renderCart();renderSettings();
  return inv;}
$("#savePrint").onclick=function(){var inv=makeInvoice();if(inv)openSheet(inv,"new",true);};
$("#saveOnly").onclick=function(){var inv=makeInvoice();if(inv)toast("تم حفظ الفاتورة رقم "+inv.no);};

/* history */
function renderHistory(){
  var l=$("#hlist");l.textContent="";var today=new Date().toDateString(),sum=0;
  S.invoices.forEach(function(i){if(new Date(i.ts).toDateString()===today)sum+=i.total;});
  $("#today").textContent=fmt(sum)+" "+S.settings.currency;
  if(!S.invoices.length)l.appendChild(el("div","empty","لا توجد فواتير محفوظة"));
  S.invoices.slice().reverse().forEach(function(i){
    var b=el("button","hist");var a=el("div");a.appendChild(el("b",null,"فاتورة #"+i.no+(i.customer?" - "+i.customer:"")));
    a.appendChild(el("small","num",dt(i.ts)));b.appendChild(a);b.appendChild(el("b","num",fmt(i.total)+" "+S.settings.currency));
    b.onclick=function(){openSheet(i,"history",false);};l.appendChild(b);});
}
function dt(ts){var d=new Date(ts),p=function(n){return String(n).padStart(2,"0");};
  return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+"  "+p(d.getHours())+":"+p(d.getMinutes());}

/* receipt rendering */
var logoImg=null;
function loadLogo(){logoImg=null;if(!S.settings.logo)return;var im=new Image();im.onload=function(){logoImg=im;};im.src=S.settings.logo;}
function FONT(size,bold){return (bold?"700 ":"400 ")+size+'px Cairo, "Segoe UI", Tahoma, Arial, sans-serif';}
async function buildReceipt(inv){
  try{await document.fonts.load(FONT(20,true));await document.fonts.load(FONT(20,false));}catch(e){}
  var W=S.settings.width,fs=W>400?26:21,pad=6,cur=S.settings.currency;
  var c=document.createElement("canvas");c.width=W;c.height=6000;var x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,c.height);x.fillStyle="#000";x.direction="rtl";x.textBaseline="alphabetic";
  var y=10;
  function lh(size){return Math.round(size*1.5);}
  function center(t,size,bold){x.font=FONT(size,bold);x.textAlign="center";y+=lh(size)-6;x.fillText(t,W/2,y);y+=6;}
  function wrap(t,maxW,size,bold){x.font=FONT(size,bold);var words=t.split(" "),lines=[],cur2="";
    words.forEach(function(w){var test=cur2?cur2+" "+w:w;if(x.measureText(test).width>maxW&&cur2){lines.push(cur2);cur2=w;}else cur2=test;});
    if(cur2)lines.push(cur2);return lines;}
  function dash(){y+=6;x.fillRect(pad,y,W-2*pad,2);y+=8;}
  function pair(l,r,size,bold){x.font=FONT(size,bold);y+=lh(size)-6;x.textAlign="right";x.fillText(r,W-pad,y);x.textAlign="left";x.fillText(l,pad,y);y+=6;}
  if(logoImg){var lw=Math.min(logoImg.width,W*0.5),lhh=lw*logoImg.height/logoImg.width;x.drawImage(logoImg,(W-lw)/2,y,lw,lhh);y+=lhh+6;}
  center(S.settings.shop,fs+6,true);
  if(S.settings.address)center(S.settings.address,fs-3,false);
  if(S.settings.phone)center("ت: "+S.settings.phone,fs-3,false);
  dash();
  pair(dt(inv.ts),"فاتورة #"+inv.no,fs-3,false);
  if(inv.customer){x.font=FONT(fs-3,false);y+=lh(fs-3)-6;x.textAlign="right";x.fillText("العميل: "+inv.customer,W-pad,y);y+=6;}
  dash();
  inv.items.forEach(function(i){
    wrap(i.name,W-2*pad,fs,true).forEach(function(ln){x.font=FONT(fs,true);y+=lh(fs)-6;x.textAlign="right";x.fillText(ln,W-pad,y);y+=6;});
    pair(fmt(i.price*i.qty),i.qty+" × "+fmt(i.price),fs-2,false);
  });
  dash();
  var sub=0;inv.items.forEach(function(i){sub+=i.price*i.qty;});
  if(inv.discount>0){pair(fmt(sub),"المجموع",fs-2,false);pair("-"+fmt(inv.discount),"الخصم",fs-2,false);}
  pair(fmt(inv.total)+" "+cur,"الإجمالي",fs+5,true);
  dash();
  if(S.settings.footer)center(S.settings.footer,fs-2,false);
  y+=26;
  var out=document.createElement("canvas");out.width=W;out.height=y;var o=out.getContext("2d");o.fillStyle="#fff";o.fillRect(0,0,W,y);o.drawImage(c,0,0);
  return out;
}

/* sheet */
var currentCanvas=null;
async function openSheet(inv,m,autoPrintHint){
  current=inv;mode=m;
  currentCanvas=await buildReceipt(inv);
  $("#preview").src=currentCanvas.toDataURL("image/png");
  $("#shDel").hidden=(m!=="history");
  $("#sheet").hidden=false;
}
$("#shClose").onclick=function(){$("#sheet").hidden=true;};
$("#sheet").onclick=function(e){if(e.target.id==="sheet")$("#sheet").hidden=true;};
$("#shPrint").onclick=function(){printCanvas(currentCanvas);};
$("#shImg").onclick=function(){var a=document.createElement("a");a.href=currentCanvas.toDataURL("image/png");a.download="invoice-"+(current?current.no:"x")+".png";document.body.appendChild(a);a.click();a.remove();};
$("#shDel").onclick=function(){if(!current)return;S.invoices=S.invoices.filter(function(i){return i.no!==current.no;});save();$("#sheet").hidden=true;renderHistory();toast("تم حذف الفاتورة");};

/* bluetooth printing (ESC/POS raster) */
var dev=null,chr=null;
var SERVICES=["000018f0-0000-1000-8000-00805f9b34fb","e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4ae5-8fa9-9fafd205e455","0000ffe0-0000-1000-8000-00805f9b34fb","0000fff0-0000-1000-8000-00805f9b34fb","0000ae30-0000-1000-8000-00805f9b34fb","0000fee7-0000-1000-8000-00805f9b34fb","00001101-0000-1000-8000-00805f9b34fb"];
function setStatus(on,txt){$("#dot").className="status"+(on?" on":"");$("#pstate").textContent=txt;}
function hasBT(){return !!(navigator.bluetooth&&navigator.bluetooth.requestDevice);}
async function connect(){
  if(!hasBT())throw new Error("المتصفح لا يدعم البلوتوث. افتح التطبيق من Chrome على أندرويد.");
  if(!dev){dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SERVICES});
    dev.addEventListener("gattserverdisconnected",function(){chr=null;setStatus(false,"غير متصلة");});}
  var server=dev.gatt.connected?dev.gatt:await dev.gatt.connect();
  var svcs=await server.getPrimaryServices();chr=null;
  for(var a=0;a<svcs.length&&!chr;a++){var cs=await svcs[a].getCharacteristics();
    for(var b=0;b<cs.length;b++){if(cs[b].properties.write||cs[b].properties.writeWithoutResponse){chr=cs[b];break;}}}
  if(!chr)throw new Error("لم أجد قناة كتابة في الطابعة. غالباً الطابعة بلوتوث كلاسيك وليس BLE.");
  setStatus(true,"متصلة: "+(dev.name||"طابعة"));
}
function raster(canvas){
  var W=canvas.width,H=canvas.height,wb=W/8;var img=canvas.getContext("2d").getImageData(0,0,W,H).data;
  var parts=[new Uint8Array([0x1b,0x40])];var STRIP=96;
  for(var y0=0;y0<H;y0+=STRIP){var h=Math.min(STRIP,H-y0);var buf=new Uint8Array(8+wb*h);
    buf.set([0x1d,0x76,0x30,0,wb&255,wb>>8,h&255,h>>8],0);
    for(var y=0;y<h;y++)for(var xb=0;xb<wb;xb++){var byte=0;
      for(var bit=0;bit<8;bit++){var p=((y0+y)*W+xb*8+bit)*4;var lum=img[p]*0.3+img[p+1]*0.59+img[p+2]*0.11;if(lum<160)byte|=(0x80>>bit);}
      buf[8+y*wb+xb]=byte;}
    parts.push(buf);}
  parts.push(new Uint8Array([0x1b,0x64,0x04]));
  var len=0;parts.forEach(function(p){len+=p.length;});var all=new Uint8Array(len),o=0;parts.forEach(function(p){all.set(p,o);o+=p.length;});return all;
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function printCanvas(canvas){
  try{
    if(!chr||!dev||!dev.gatt.connected){toast("جاري الاتصال بالطابعة...");await connect();}
    var data=raster(canvas),CH=100;toast("جاري الطباعة...");
    for(var i=0;i<data.length;i+=CH){var slice=data.slice(i,i+CH);
      if(chr.properties.writeWithoutResponse)await chr.writeValueWithoutResponse(slice);else await chr.writeValue(slice);
      await sleep(18);}
    toast("تمت الطباعة");
  }catch(e){
    if(e&&e.name==="NotFoundError"){toast("لم يتم اختيار طابعة");return;}
    toast(e&&e.message?e.message:"تعذرت الطباعة");}
}
$("#connect").onclick=async function(){try{await connect();toast("تم الاتصال بالطابعة");}catch(e){if(!(e&&e.name==="NotFoundError"))toast(e.message||"تعذر الاتصال");}};

  printCanvas(await buildReceipt(inv));};

function renderSettings(){var s=S.settings;
  $("#shop").value=s.shop;$("#phone").value=s.phone;$("#address").value=s.address;$("#footer").value=s.footer;
  $("#currency").value=s.currency;$("#nextNo").value=s.next;$("#width").value=String(s.width);}
["shop","phone","address","footer","currency"].forEach(function(k){$("#"+k).oninput=function(){S.settings[k]=this.value;save();renderProducts();renderCart();};});
$("#nextNo").oninput=function(){var n=parseInt(this.value,10);if(n>0){S.settings.next=n;save();}};
$("#width").onchange=function(){S.settings.width=parseInt(this.value,10);save();};
$("#logo").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(300,im.width),h=w*im.height/im.width;
    var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
    S.settings.logo=c.toDataURL("image/png");save();loadLogo();toast("تم حفظ اللوجو");};im.src=r.result;};r.readAsDataURL(f);};
$("#rmLogo").onclick=function(){S.settings.logo="";save();loadLogo();toast("تم حذف اللوجو");};
$("#exportBtn").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
  a.download="faweety-backup.json";document.body.appendChild(a);a.click();a.remove();};
$("#importFile").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);S.products=d.products||[];S.invoices=d.invoices||[];Object.assign(S.settings,d.settings||{});save();
    renderProducts();renderCart();renderSettings();loadLogo();toast("تم استيراد البيانات");}catch(e){toast("الملف غير صالح");}};r.readAsText(f);};
$("#btNote").textContent=hasBT()?"الطباعة بتتم كصورة، فبتدعم العربي على أي طابعة حرارية تعمل بالبلوتوث BLE.":"البلوتوث غير متاح هنا. افتح التطبيق من Chrome على أندرويد عشان الطباعة تشتغل.";

renderProducts();renderCart();renderSettings();loadLogo();
})();
